<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timetable today</title><style>
*{box-sizing:border-box}body{margin:0;background:var(--hub-surface,#fff);color:var(--hub-text,#17202e);font:13px/1.4 var(--hub-font,system-ui,sans-serif)}header{padding:10px 12px;border-bottom:1px solid var(--hub-border,#dce2eb);font-weight:700}#list{max-height:calc(100vh - 56px);overflow:auto}.lesson{padding:6px 12px;border-bottom:1px solid var(--hub-border,#eef1f6);display:grid;grid-template-columns:42px 1fr;gap:8px}.lesson.current{background:#eaf0ff}.muted{color:var(--hub-text-muted,#607083)}.empty{padding:18px 12px;text-align:center;color:var(--hub-text-muted,#607083)}.name{font-weight:700}
</style></head><body><header>School today</header><div id="list" class="empty">Loading…</div><script type="module">
const DB=window.__DB_URL??'',CONTEXT=window.__CONTEXT_URL??'',esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let zone='UTC',today='',rows=[],members=[];const list=document.querySelector('#list');
function localParts(){const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:zone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).map(x=>[x.type,x.value]));return{date:`${p.year}-${p.month}-${p.day}`,time:`${p.hour}:${p.minute}`};}
async function db(sql,params=[]){const r=await fetch(DB,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sql,params})});const j=await r.json();if(!r.ok||j.error)throw new Error(j.error||'Could not load the timetable.');return j.rows??[];}
async function load(){try{if(!DB){list.textContent='Open from a household to see today.';return;}if(CONTEXT){const r=await fetch(`${CONTEXT}?keys=family.preferences,family.members`);const j=await r.json();zone=j['family.preferences']?.timezone??'UTC';members=j['family.members']??[];}today=localParts().date;rows=await db("SELECT t.member_id AS student_id, t.name AS timetable, l.subject AS subject, l.room AS room, p.start_time AS start_time, p.end_time AS end_time FROM app_timetable__school_days s JOIN app_timetable__timetables t ON t.id = s.timetable_id AND t.status = 'active' JOIN app_timetable__lessons l ON l.timetable_id = t.id AND l.slot = s.slot JOIN app_timetable__periods p ON p.id = l.period_id AND p.timetable_id = t.id WHERE s.day_date = ? ORDER BY p.start_time, t.member_id, l.id LIMIT 101",[today]);render();}catch(e){list.textContent=e.message;}}
function render(){const {date,time}=localParts();if(date!==today){load();return;}list.className=rows.length?'':'empty';list.innerHTML=rows.length?rows.slice(0,100).map(r=>`<div class="lesson ${r.start_time<=time&&time<r.end_time?'current':''}"><span>${esc(r.start_time)}</span><div><span class="name">${esc(members.find(m=>m.id===r.student_id)?.name??r.timetable)} · ${esc(r.subject)}</span>${r.room?`<div class="muted">${esc(r.room)}</div>`:''}</div></div>`).join('')+(rows.length>100?'<div class="empty">More lessons in Timetable</div>':''):'No school lessons today.';}
setInterval(render,60_000);load();
</script></body></html>
