<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--bg:var(--hub-bg,#f6f7fb);--card:var(--hub-surface,#fff);--text:var(--hub-text,#17202e);--muted:var(--hub-text-muted,#607083);--border:var(--hub-border,#dce2eb);--accent:var(--hub-primary,#274a8a);--on:var(--hub-primary-fg,#fff)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--hub-font,system-ui,sans-serif)}main{max-width:1100px;margin:auto;padding:20px}h1{font-size:1.55rem;margin:0}h2{font-size:1.15rem;margin:0 0 12px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.stack{display:grid;gap:16px}.stack>*{min-width:0}.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}.muted{color:var(--muted)}.small{font-size:.85rem}button{font:inherit;cursor:pointer;border:1px solid var(--border);border-radius:8px;padding:8px 11px;background:var(--card);color:var(--text)}button.primary{background:var(--accent);color:var(--on);border-color:var(--accent)}button:disabled{opacity:.5;cursor:default}button.danger{color:#a52222}input,select,textarea{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px;width:100%}textarea{min-height:65px}label{display:grid;gap:4px;font-weight:600;font-size:.88rem}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.banner{padding:10px 12px;border-radius:8px;background:#fff1e9;color:#863d17}.list{display:grid;gap:8px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--border)}.row:last-child{border:0}.grid-wrap{overflow:auto}.grid{border-collapse:collapse;min-width:700px;width:100%}.grid th,.grid td{border:1px solid var(--border);padding:5px;vertical-align:top}.grid th{background:var(--bg);position:sticky;top:0}.grid .period{min-width:130px;text-align:left}.cell{width:100%;min-height:70px;text-align:left;background:transparent;border:0;display:grid;align-content:center}.cell strong{display:block}.cell:hover,.cell:focus{background:#eaf0ff}.cell.empty{color:var(--muted)}.today{box-shadow:inset 4px 0 var(--accent)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}dialog{border:1px solid var(--border);border-radius:12px;padding:20px;max-width:min(440px,95vw);width:100%;color:var(--text);background:var(--card)}dialog::backdrop{background:#17202e88}.dialog-head{display:flex;justify-content:space-between;align-items:center}.period-form{display:grid;grid-template-columns:1fr 110px 110px auto;gap:8px;align-items:end}@media(max-width:600px){main{padding:12px}.period-form{grid-template-columns:1fr 1fr}.top{align-items:start}}
</style></head><body><main><div class="top"><div><h1>School timetables</h1><div class="muted small">Week patterns and rotating school days</div></div><button id="refresh" type="button">Refresh</button></div><div id="root" class="stack" aria-live="polite">Loading…</div></main>
<dialog id="cellDialog"><div class="dialog-head"><h2 id="cellTitle">Lesson</h2><button type="button" id="closeDialog" aria-label="Close">✕</button></div>
<form id="cellForm" class="stack"><label>Subject<input name="subject" required maxlength="80" list="subjects"></label><datalist id="subjects"></datalist><div class="fields"><label>Room<input name="room" maxlength="80"></label><label>Teacher<input name="teacher" maxlength="80"></label></div><div class="fields"><label>Colour<input name="color" type="color" value="#607cae"></label><label>Notes<textarea name="notes" maxlength="500"></textarea></label></div><div class="actions"><button class="primary" type="submit" name="intent" value="save">Save</button><button type="submit" name="intent" value="next">Save &amp; next</button><button type="button" id="deleteCell" class="danger">Clear lesson</button></div></form></dialog>
<script type="module">
import { anchorFromPhase, columnSlots, overlappingPeriod, projectSchoolDays, slotForDate, validateTimetable, validatePeriods, validateLessons, weekday, mondayOf, addDays } from './logic.js';
import { IMPORT_LIMITS, buildCandidate, candidateRows, carryOver, diffCandidate, digestText, parseTimetableText, planImportBatches } from './import.js';
const DB=window.__DB_URL??'', CONTEXT=window.__CONTEXT_URL??'', HUB_MEMBER=window.__CURRENT_MEMBER??null;
const T='app_timetable__';const root=document.querySelector('#root'), dialog=document.querySelector('#cellDialog');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let members=[],me=HUB_MEMBER,timezone='UTC',today='',timetables=[],selected=null,periods=[],lessons=[],exceptions=[],error='',busy=false,cell=null,loading=true;
// Import (plan §5): importText survives "Back to edit"; importReview holds the parsed candidate until saved or cancelled.
let importText='',importReview=null;
// importing spans an import's writes. Unlike busy, nothing else (refresh, an error message) clears it.
let importing=false;
const nameOf=id=>members.find(m=>m.id===id)?.name??'Student';
const adult=()=>['adult','admin','owner'].includes(me?.role);
const canEdit=t=>!!me?.id&&(adult()||t?.member_id===me.id);
const now=()=>new Date().toISOString();
function localToday(){const parts=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:timezone,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).map(x=>[x.type,x.value]));return `${parts.year}-${parts.month}-${parts.day}`;}
async function request(body){if(!DB)throw new Error('Open this app inside a household to save.');const r=await fetch(DB,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok||j.error)throw new Error(j.error||`Database request failed (${r.status}).`);return j;}
async function db(sql,params=[]){return (await request({sql,params})).rows??[];}
async function batch(statements){if(statements.length>25)throw new Error('Save exceeds the 25-statement transaction limit.');return request({statements});}
async function pages(table,id,order='id'){const all=[];for(let offset=0;;offset+=100){const rows=await db(`SELECT * FROM ${T}${table} WHERE timetable_id = ? ORDER BY ${order}, id LIMIT 100 OFFSET ?`,[id,offset]);all.push(...rows);if(rows.length<100)break;if(offset>=2000)throw new Error('Timetable exceeds the supported editing size.');}return all;}
async function loadContext(){if(!CONTEXT){members=[{id:'demo-student',name:'Alex',role:'child'}];me=me??members[0];timezone='UTC';return;}const r=await fetch(`${CONTEXT}?keys=family.members,family.preferences`);const j=await r.json();if(!r.ok)throw new Error('Could not load household context.');members=j['family.members']??[];timezone=j['family.preferences']?.timezone??'UTC';me=HUB_MEMBER??members.find(m=>m.id===j.currentMemberId)??null;}
async function loadList(){if(!DB){timetables=[];return;}const all=[];const first=await db(`SELECT * FROM ${T}timetables WHERE status = 'active' ORDER BY created_at, id LIMIT 20`);all.push(...first);if(first.length===20)for(let offset=20;;offset+=20){const rows=await db(`SELECT * FROM ${T}timetables WHERE status = 'active' ORDER BY created_at, id LIMIT 20 OFFSET ?`,[offset]);all.push(...rows);if(rows.length<20)break;}for(let offset=0;;offset+=50){const rows=await db(`SELECT * FROM ${T}timetables WHERE status = 'draft' ORDER BY created_at, id LIMIT 50 OFFSET ?`,[offset]);all.push(...rows);if(rows.length<50)break;}timetables=all;}
async function loadSelected(id){if(!id){selected=null;periods=[];lessons=[];exceptions=[];return;}const before=(await db(`SELECT * FROM ${T}timetables WHERE id = ? LIMIT 1`,[id]))[0];if(!before)throw new Error('Timetable is no longer available.');const [p,l,e]=await Promise.all([pages('periods',id,'sort_order'),pages('lessons',id,'slot'),pages('exceptions',id,'start_date')]);const after=(await db(`SELECT revision FROM ${T}timetables WHERE id = ? LIMIT 1`,[id]))[0];if(before.revision!==after?.revision)throw new Error('Timetable changed while loading. Refresh before editing.');selected=before;periods=p;lessons=l;exceptions=e;validateTimetable(selected,exceptions);validateLessons(lessons,periods,selected);}
async function refresh(keepId=selected?.id){busy=true;loading=true;render();try{await loadContext();today=localToday();await loadList();const id=timetables.find(t=>t.id===keepId)?.id??timetables.find(t=>t.status==='active')?.id??null;await loadSelected(id);error='';}catch(e){error=e.message;}finally{if(importReview)await loadComparison();busy=false;loading=false;render();}}
function updateGuard(changes=''){return {sql:`UPDATE ${T}timetables SET revision = revision + 1, updated_at = ?${changes} WHERE id = ? AND revision = ?`,params:[now(),selected.id,selected.revision],requireChanges:true};}
async function guarded(statements){if(!selected||!canEdit(selected))throw new Error('You cannot edit this timetable.');busy=true;render(true);try{await batch([updateGuard(),...statements]);await refresh(selected.id);}catch(e){error=e.message.includes('Stale state claim')?'Someone changed this timetable. Refresh and try again.':e.message;busy=false;render(true);}}
function insertRows(table,columns,rows,chunkSize=20){chunkSize=Math.min(chunkSize,Math.floor(100/columns.length));const statements=[];for(let i=0;i<rows.length;i+=chunkSize){const chunk=rows.slice(i,i+chunkSize);statements.push({sql:`INSERT INTO ${T}${table} (${columns.join(',')}) VALUES ${chunk.map(()=>`(${columns.map(()=>'?').join(',')})`).join(',')}`,params:chunk.flatMap(row=>columns.map(c=>row[c]===undefined?'':row[c]))});}return statements;}
function projectionStatements(t,e){const rows=projectSchoolDays(t,e).map(r=>({...r,created_by:me.id}));return [{sql:`DELETE FROM ${T}school_days WHERE timetable_id = ?`,params:[t.id]},...insertRows('school_days',['id','timetable_id','day_date','slot','created_by'],rows,20)];}
function message(e){error=e.message??String(e);busy=false;render(true);}
function addMinutes(time,minutes){const [h,m]=time.split(':').map(Number),n=h*60+m+minutes;if(n<0||n>=1440)throw new Error('Bell schedule must fit within one day.');return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;}
function starterPeriods(t,v){const count=Number(v.period_count),duration=Number(v.period_minutes),gap=Number(v.break_minutes),first=v.first_start;if(!Number.isInteger(count)||count<0||count>12||!Number.isInteger(duration)||duration<10||duration>120||!Number.isInteger(gap)||gap<0||gap>60)throw new Error('Use 0–12 bell periods, 10–120 lesson minutes and 0–60 break minutes.');const rows=[];for(let i=0;i<count;i++){const start_time=addMinutes(first,i*(duration+gap)),end_time=addMinutes(start_time,duration);rows.push({id:crypto.randomUUID(),timetable_id:t.id,label:`Period ${i+1}`,start_time,end_time,sort_order:i,created_by:me.id});}validatePeriods(rows);return rows;}
async function createTimetable(form){if(!me?.id)throw new Error('Member identity is required.');const v=Object.fromEntries(new FormData(form));const member_id=adult()?v.student:me.id;if(!member_id)throw new Error('Choose a student.');const cycle_kind=v.cycle_kind,cycle_length=Number(v.cycle_length),phase=Number(v.phase),date=v.phase_date;const t={id:crypto.randomUUID(),member_id,name:v.name.trim(),cycle_kind,cycle_length,anchor_date:anchorFromPhase(date,cycle_kind,cycle_length,phase),start_date:v.start_date,end_date:v.end_date,override_consumes_cycle_day:v.consumes==='on'?1:0,status:'draft',revision:0,export_mode:'off',created_by:me.id,created_at:now(),updated_at:now()};validateTimetable(t);const starter=starterPeriods(t,v);const previous=timetables.find(x=>x.member_id===member_id&&x.status==='active');if(previous&&!confirm(`Archive ${previous.name} and replace it with this timetable?`))return;busy=true;render(true);try{
await db(`INSERT INTO ${T}timetables (id,member_id,name,cycle_kind,cycle_length,anchor_date,start_date,end_date,override_consumes_cycle_day,status,revision,export_mode,created_by,created_at,updated_at) VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)`,Object.keys(t).map(k=>t[k]));
const statements=[];if(previous)statements.push({sql:`UPDATE ${T}timetables SET status = 'archived', revision = revision + 1, updated_at = ? WHERE id = ? AND revision = ?`,params:[now(),previous.id,previous.revision],requireChanges:true});
statements.push({sql:`UPDATE ${T}timetables SET status = 'active', revision = revision + 1, updated_at = ? WHERE id = ? AND revision = 0`,params:[now(),t.id],requireChanges:true});statements.push(...insertRows('periods',['id','timetable_id','label','start_time','end_time','sort_order','created_by'],starter,12));statements.push(...projectionStatements(t,[]));await batch(statements);await refresh(t.id);
}catch(e){message(e);}}
function activationStatements(t,previous,e){const st=[];if(previous)st.push({sql:`UPDATE ${T}timetables SET status = 'archived', revision = revision + 1, updated_at = ? WHERE id = ? AND revision = ?`,params:[now(),previous.id,previous.revision],requireChanges:true});st.push({sql:`UPDATE ${T}timetables SET status = 'active', revision = revision + 1, updated_at = ? WHERE id = ? AND revision = ?`,params:[now(),t.id,t.revision],requireChanges:true});st.push(...projectionStatements(t,e));return st;}
async function activateDraft(){if(selected.status!=='draft')return;const previous=timetables.find(x=>x.member_id===selected.member_id&&x.status==='active');if(previous&&!confirm(`Archive ${previous.name} and activate this draft?`))return;const st=activationStatements(selected,previous,exceptions);busy=true;render(true);try{await batch(st);await refresh(selected.id);}catch(e){message(e);}}
const cycleText=t=>t.cycle_kind==='weekly'?`${t.cycle_length}-week cycle`:`${t.cycle_length}-day rotation`;
async function previewImport(text){const candidate=buildCandidate(parseTimetableText(text));const digest=candidate.errors.length?'':await digestText(text);importText=text;importReview={text,source_kind:'csv',digest,candidate,student:adult()?members.find(m=>m.role!=='guest')?.id??null:me?.id??null,compare:null};await loadComparison();error='';render(true);}
// The replace diff needs the student's active grid, which is only loaded for the selected timetable.
// compare is {student,state:'none'|'loading'|'ready'|'error',...}; a load that finishes after the
// student changed is dropped, and Import stays disabled until the current student's state settles.
async function loadComparison(){const r=importReview;if(!r)return;const student=r.student;const current=DB&&!r.candidate.errors.length?timetables.find(t=>t.member_id===student&&t.status==='active'):null;if(!current){r.compare={student,state:'none'};return;}if(r.compare?.student===student&&r.compare.state==='ready'&&r.compare.timetable.id===current.id&&r.compare.timetable.revision===current.revision)return;r.compare={student,state:'loading',timetable:current};try{const [p,l,x]=await Promise.all([pages('periods',current.id,'sort_order'),pages('lessons',current.id,'slot'),pages('exceptions',current.id,'start_date')]);if(importReview===r&&r.student===student)r.compare={student,state:'ready',timetable:current,periods:p,lessons:l,exceptions:x};}catch(e){if(importReview===r&&r.student===student)r.compare={student,state:'error',timetable:current,error:e.message};}}
const comparisonReady=r=>{const c=r.compare,active=timetables.find(t=>t.member_id===r.student&&t.status==='active');if(c?.student!==r.student)return false;if(c.state==='none')return !active;return c.state==='ready'&&!!active&&c.timetable.id===active.id&&c.timetable.revision===active.revision;};
// Import saves a new draft across guarded batches, then activates it in one batch (plan §5.5).
// A failed population discards the draft; a failed activation leaves a complete draft to activate later.
async function saveImport(form){if(busy||importing)throw new Error('Wait for the current save to finish.');const r=importReview;if(!r)throw new Error('Preview an import first.');if(r.candidate.errors.length)throw new Error('Fix the import errors first.');if(!me?.id)throw new Error('Member identity is required.');const v=Object.fromEntries(new FormData(form));r.values={...v,consumes:v.consumes??'',keep_exceptions:v.keep_exceptions??''};const member_id=adult()?v.student:me.id;if(!member_id)throw new Error('Choose a student.');if(member_id!==r.student||!comparisonReady(r))throw new Error('The student changed. Check the review and try again.');const max=r.candidate.cycle_kind==='weekly'?4:10,cycle_length=Number(v.cycle_length??r.candidate.cycle_length);if(!Number.isInteger(cycle_length)||cycle_length<r.candidate.min_cycle_length||cycle_length>max)throw new Error(`Cycle length must be ${r.candidate.min_cycle_length}–${max}.`);const c={...r.candidate,cycle_length};
const t={id:crypto.randomUUID(),member_id,name:String(v.name??'').trim(),cycle_kind:c.cycle_kind,cycle_length:c.cycle_length,anchor_date:'',start_date:v.start_date,end_date:v.end_date,override_consumes_cycle_day:v.consumes==='on'?1:0,status:'draft',revision:0,export_mode:'off',created_by:me.id,created_at:now(),updated_at:now(),source_kind:r.source_kind,source_digest:r.digest};
// Replacing a timetable keeps its holidays and overrides (if ticked), colours and unchanged notes.
const current=r.compare.state==='ready'?r.compare:null;const kept=current&&v.keep_exceptions==='on'?current.exceptions.map(e=>({...e,id:crypto.randomUUID(),timetable_id:t.id,created_by:me.id})):[];
// The chosen date's day number counts past the kept holidays, exactly as the projection will.
t.anchor_date=anchorFromPhase(v.phase_date,c.cycle_kind,c.cycle_length,Number(v.phase)-1,kept,t.override_consumes_cycle_day);
try{validateTimetable(t,kept);}catch(e){throw kept.length?new Error(`The holidays and day overrides kept from ${current.timetable.name} don't fit this timetable: ${e.message} Adjust the term dates or untick keeping them.`):e;}
projectSchoolDays(t,kept);let rows=candidateRows(c,t,me.id,()=>crypto.randomUUID());if(current)rows=carryOver(rows,current);const plan=planImportBatches(t,rows.periods,rows.lessons,kept,{prefix:T,now:now()});const previous=timetables.find(x=>x.member_id===member_id&&x.status==='active');
busy=true;importing=true;render(true);try{
try{await db(`INSERT INTO ${T}timetables (${Object.keys(t).join(',')}) VALUES (${Object.keys(t).map(()=>'?').join(',')})`,Object.values(t));}catch(e){message(e);return;}
try{for(const b of plan.batches)await batch(b);}catch(e){const discarded=await request({sql:`DELETE FROM ${T}timetables WHERE id = ? AND status = 'draft'`,params:[t.id]}).then(j=>j.changed===1,()=>false);await refresh(selected?.id);error=discarded?`Import failed and nothing was saved: ${e.message}`:`Import failed partway: ${e.message} The incomplete timetable ${t.name} could not be removed, possibly because someone opened or activated it. Check it before importing again.`;render(true);return;}
// Either way the review closes: a second Import would save a duplicate instead of activating this complete draft.
importReview=null;importText='';try{await batch(activationStatements({...t,revision:plan.revision},previous,kept));await refresh(t.id);}catch(e){await refresh(t.id);error=`The import was saved as a draft but not activated: ${e.message.includes('Stale state claim')?'the current timetable changed while importing.':e.message} Check it, then choose Activate draft.`;render();}
}finally{importing=false;render(true);}}
function previewGrid(c){const slots=columnSlots(c);return `<div class="grid-wrap"><table class="grid"><thead><tr><th class="period">Time</th>${slots.map(s=>`<th>${esc(s.label)}</th>`).join('')}</tr></thead><tbody>${c.periods.map(p=>`<tr><th class="period">${esc(p.label)}<br><span class="muted small">${esc(p.start_time)}–${esc(p.end_time)}</span></th>${slots.map(s=>{const l=c.lessons.find(x=>x.slot===s.slot&&x.period_key===p.key);return `<td>${l?`<strong>${esc(l.subject)}</strong><br><span class="small">${esc([l.room,l.teacher].filter(Boolean).join(' · '))}</span>`:''}</td>`;}).join('')}</tr>`).join('')}</tbody></table></div>`;}
function diffHtml(r){const cur=r.compare;if(!DB)return '<p class="muted small">Demo preview: nothing will be replaced.</p>';if(cur?.student!==r.student||cur.state==='loading')return '<p class="muted small">Checking this student’s current timetable…</p>';if(cur.state==='error')return `<div class="banner" role="alert">Could not load ${esc(cur.timetable.name)} to compare: ${esc(cur.error)} Refresh and try again.</div>`;if(cur.state==='none')return '<p class="muted small">This student has no active timetable, so the import becomes their timetable.</p>';const d=diffCandidate(r.candidate,cur);const label=(t,slot)=>columnSlots(t).find(s=>s.slot===slot)?.label??`Slot ${slot}`;const lines=d.lessons.slice(0,40).map(x=>`<li>${esc(label(x.change==='removed'?cur.timetable:r.candidate,x.slot))} ${esc(x.time.replace('-','–'))}: ${x.change==='added'?`adds ${esc(x.after)}`:x.change==='removed'?`removes ${esc(x.before)}`:`${esc(x.before)} → ${esc(x.after)}`}</li>`).join('');
return `<div class="banner">Importing archives <strong>${esc(cur.timetable.name)}</strong> and replaces it. Lesson colours carry over for matching subjects, and notes for unchanged lessons.</div><ul class="small">${d.cycleChanged?`<li>Cycle changes from ${esc(cycleText(cur.timetable))} to ${esc(cycleText(r.candidate))}.${d.kindChanged?` All ${d.lessonCounts.before} current lessons are replaced by the ${d.lessonCounts.after} shown above.`:''}</li>`:''}${d.addedTimes.length?`<li>New bell times: ${esc(d.addedTimes.join(', '))}</li>`:''}${d.removedTimes.length?`<li>Removed bell times: ${esc(d.removedTimes.join(', '))}</li>`:''}${lines}${d.lessons.length>40?`<li>…and ${d.lessons.length-40} more lesson changes.</li>`:''}${!d.cycleChanged&&!d.addedTimes.length&&!d.removedTimes.length&&!d.lessons.length?'<li>No lesson or bell-time changes.</li>':''}</ul>`;}
function importCard(){if(!importReview)return `<section class="card"><h2>Import from a spreadsheet</h2><form id="importText" class="stack"><label>Choose a CSV or TSV file<input type="file" name="file" accept=".csv,.tsv,.txt,text/csv,text/tab-separated-values,text/plain"></label><label>Or paste<textarea name="text" spellcheck="false" placeholder="Day,Week,Start,End,Subject,Room&#10;Mon,A,08:30,09:15,Maths,Rm 12">${esc(importText)}</textarea></label><div class="small muted">Use columns named day, week (optional), start, end, subject, room and teacher in any order, or paste a grid with days across the top and times down the side. Nothing is saved until you review it.</div><div><button class="primary" ${busy?'disabled':''}>Preview import</button></div></form></section>`;
const r=importReview,c=r.candidate;const back=`<button type="button" data-import-back ${busy?'disabled':''}>Back to edit</button><button type="button" data-import-cancel ${busy?'disabled':''}>Cancel</button>`;
if(c.errors.length)return `<section class="card"><h2>Review import</h2><div class="banner" role="alert"><strong>Fix ${c.errorCount>c.errors.length?`these (showing ${c.errors.length} of ${c.errorCount})`:'these'} before importing:</strong><ul>${c.errors.map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div><div class="actions">${back}</div></section>`;
const repeat=timetables.filter(t=>t.source_digest&&t.source_digest===r.digest);const current=timetables.find(t=>t.member_id===r.student&&t.status==='active');const students=members.filter(m=>m.role!=='guest'&&(adult()||m.id===me?.id));const unit=c.cycle_kind==='weekly'?'Week number (A = 1)':'Cycle day number';const val=(k,d)=>r.values?.[k]??d;const base=r.compare?.student===r.student&&r.compare.state==='ready'?r.compare:null;
return `<section class="card"><h2>Review import</h2><p>${esc(cycleText(c))} · ${c.periods.length} bell ${c.periods.length===1?'period':'periods'} · ${c.lessons.length} ${c.lessons.length===1?'lesson':'lessons'}</p>${c.warnings.length?`<ul class="small muted">${c.warnings.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>`:''}${repeat.length?`<div class="banner">You already imported this exact text as ${repeat.map(t=>`${esc(t.name)} for ${esc(nameOf(t.member_id))} (${esc(t.status)})`).join(', ')}.</div>`:''}<div id="importPreview">${previewGrid(c)}</div>
<form id="importReview" class="stack" style="margin-top:16px"><div class="fields"><label>Student<select name="student" ${adult()&&!busy?'':'disabled'}>${students.map(m=>`<option value="${esc(m.id)}" ${m.id===r.student?'selected':''}>${esc(m.name)}</option>`).join('')}</select></label><label>Timetable name<input name="name" required value="${esc(val('name','School'))}"></label><label>Term starts<input name="start_date" type="date" value="${esc(val('start_date',base?.timetable.start_date??mondayOf(today)))}" required></label><label>Term ends<input name="end_date" type="date" value="${esc(val('end_date',base?.timetable.end_date??addDays(today,90)))}" required></label></div><div class="fields"><label>${c.cycle_kind==='weekly'?'Weeks in the cycle':'Days in the rotation'}<input name="cycle_length" type="number" min="${c.min_cycle_length}" max="${c.cycle_kind==='weekly'?4:10}" value="${esc(val('cycle_length',c.cycle_length))}" required></label><label>Known school date<input name="phase_date" type="date" value="${esc(val('phase_date',today))}" required></label><label>${unit}<input name="phase" type="number" min="1" max="${c.cycle_length}" value="${esc(val('phase','1'))}" required></label></div>${c.cycle_kind==='day_rotation'?`<label><input name="consumes" type="checkbox" style="width:auto" ${r.values?.consumes==='on'?'checked':''}> An overridden rotation day consumes a cycle day</label>`:''}${base?.exceptions.length?`<label><input name="keep_exceptions" type="checkbox" style="width:auto" ${val('keep_exceptions','on')==='on'?'checked':''}> Keep ${base.exceptions.length} ${base.exceptions.length===1?'holiday or day override':'holidays and day overrides'} from ${esc(base.timetable.name)}</label>`:''}<div class="small muted">Choose which ${c.cycle_kind==='weekly'?'week':'cycle day'} the known date falls on.${base?' Term dates start from the timetable being replaced.':' Add holidays under Term dates after importing.'}</div><div id="importDiff">${diffHtml(r)}</div><div class="actions"><button class="primary" ${busy||importing||!DB||!me?.id||!comparisonReady(r)?'disabled':''}>${current?`Import and replace ${esc(current.name)}`:'Import and activate'}</button>${back}</div></form></section>`;}
async function savePeriod(form){const v=Object.fromEntries(new FormData(form));const id=form.dataset.period;const row={id:id||crypto.randomUUID(),timetable_id:selected.id,label:v.label.trim(),start_time:v.start_time,end_time:v.end_time,sort_order:id?Number(periods.find(p=>p.id===id).sort_order):Math.max(-1,...periods.map(p=>Number(p.sort_order)))+1,created_by:me.id};validatePeriods([...periods.filter(p=>p.id!==id),row]);const prior=id&&periods.find(p=>p.id===id),clash=(!prior||prior.start_time!==row.start_time||prior.end_time!==row.end_time)&&overlappingPeriod(row,periods);if(clash)throw new Error(`${row.label} overlaps ${clash.label} (${clash.start_time}–${clash.end_time}).`);const statement=id?{sql:`UPDATE ${T}periods SET label = ?, start_time = ?, end_time = ? WHERE id = ? AND timetable_id = ?`,params:[row.label,row.start_time,row.end_time,id,selected.id],requireChanges:true}:{sql:`INSERT INTO ${T}periods (id,timetable_id,label,start_time,end_time,sort_order,created_by) VALUES (?,?,?,?,?,?,?)`,params:Object.keys(row).map(k=>row[k])};await guarded([statement]);}
async function deletePeriod(id){if(!confirm('Remove this period and its lessons in every cycle day?'))return;await guarded([{sql:`DELETE FROM ${T}lessons WHERE timetable_id = ? AND period_id = ?`,params:[selected.id,id]},{sql:`DELETE FROM ${T}periods WHERE timetable_id = ? AND id = ?`,params:[selected.id,id],requireChanges:true}]);}
async function saveLesson(v,intent){const existing=lessons.find(l=>l.slot===cell.slot&&l.period_id===cell.periodId);const row={id:existing?.id??crypto.randomUUID(),timetable_id:selected.id,slot:cell.slot,period_id:cell.periodId,subject:String(v.subject??'').trim(),room:String(v.room??'').trim(),teacher:String(v.teacher??'').trim(),color:v.color??'',notes:String(v.notes??'').trim(),created_by:existing?.created_by??me.id};validateLessons([...lessons.filter(l=>l.id!==existing?.id),row],periods,selected);const st=existing?{sql:`UPDATE ${T}lessons SET subject = ?, room = ?, teacher = ?, color = ?, notes = ? WHERE id = ? AND timetable_id = ?`,params:[row.subject,row.room,row.teacher,row.color,row.notes,row.id,selected.id],requireChanges:true}:{sql:`INSERT INTO ${T}lessons (id,timetable_id,slot,period_id,subject,room,teacher,color,notes,created_by) VALUES (?,?,?,?,?,?,?,?,?,?)`,params:Object.keys(row).map(k=>row[k])};const old=cell;await guarded([st]);if(!error){if(intent==='next'){const slots=columnSlots(selected);let p=periods.findIndex(x=>x.id===old.periodId),c=slots.findIndex(x=>x.slot===old.slot);p++;if(p>=periods.length){p=0;c=(c+1)%slots.length;}openCell(slots[c].slot,periods[p].id);}else dialog.close();}}
async function clearLesson(){const l=lessons.find(x=>x.slot===cell.slot&&x.period_id===cell.periodId);if(l)await guarded([{sql:`DELETE FROM ${T}lessons WHERE id = ? AND timetable_id = ?`,params:[l.id,selected.id],requireChanges:true}]);if(!error)dialog.close();}
async function clearDay(slot){if(!confirm('Clear every lesson in this cycle day?'))return;await guarded([{sql:`DELETE FROM ${T}lessons WHERE timetable_id = ? AND slot = ?`,params:[selected.id,slot]}]);}
async function copyWeek(){if(selected.cycle_kind!=='weekly'||selected.cycle_length<2)return;const rows=lessons.filter(l=>l.slot>=0&&l.slot<=4).map(l=>({...l,id:crypto.randomUUID(),slot:l.slot+7,created_by:me.id}));if(!confirm('Replace Week B lessons with a copy of Week A?'))return;const st=[{sql:`DELETE FROM ${T}lessons WHERE timetable_id = ? AND slot BETWEEN 7 AND 11`,params:[selected.id]},...insertRows('lessons',['id','timetable_id','slot','period_id','subject','room','teacher','color','notes','created_by'],rows,9)];await guarded(st);}
function readExceptions(form){const data=new FormData(form),raw=String(data.get('exceptions')??'').trim();if(!raw)return [];return raw.split(/\n/).filter(Boolean).map(line=>{const parts=line.split('|').map(x=>x.trim());if(parts[0]==='no_school'){const [kind,start_date,end_date,label='']=parts;return{id:crypto.randomUUID(),timetable_id:selected.id,kind,start_date,end_date,label,override_slot:null,created_by:me.id};}if(parts[0]==='day_override'){const [kind,date,slot,label='']=parts;return{id:crypto.randomUUID(),timetable_id:selected.id,kind,start_date:date,end_date:date,override_slot:Number(slot),label,created_by:me.id};}throw new Error('Exception lines start with no_school or day_override.');});}
async function saveTerm(form){const v=Object.fromEntries(new FormData(form)),e=readExceptions(form);const t={...selected,start_date:v.start_date,end_date:v.end_date,anchor_date:v.anchor_date,override_consumes_cycle_day:v.consumes==='on'?1:0};validateTimetable(t,e);const st=[{sql:`UPDATE ${T}timetables SET start_date = ?, end_date = ?, anchor_date = ?, override_consumes_cycle_day = ?, revision = revision + 1, updated_at = ? WHERE id = ? AND revision = ?`,params:[t.start_date,t.end_date,t.anchor_date,t.override_consumes_cycle_day,now(),t.id,t.revision],requireChanges:true},{sql:`DELETE FROM ${T}exceptions WHERE timetable_id = ?`,params:[t.id]},...insertRows('exceptions',['id','timetable_id','start_date','end_date','kind','override_slot','label','created_by'],e,12),...projectionStatements(t,e)];if(st.length>25)throw new Error('Too many exceptions for one atomic term save.');busy=true;render(true);try{await batch(st);await refresh(t.id);}catch(err){message(err);}}
async function archive(){if(!confirm(`Archive ${selected.name}?`))return;await guarded([{sql:`UPDATE ${T}timetables SET status = 'archived' WHERE id = ? AND member_id = ?`,params:[selected.id,selected.member_id]}]);}
function openCell(slot,periodId){cell={slot,periodId};const l=lessons.find(x=>x.slot===slot&&x.period_id===periodId);const f=document.querySelector('#cellForm');f.subject.value=l?.subject??'';f.room.value=l?.room??'';f.teacher.value=l?.teacher??'';f.color.value=l?.color||'#607cae';f.notes.value=l?.notes??'';document.querySelector('#cellTitle').textContent=`${columnSlots(selected).find(x=>x.slot===slot)?.label} · ${periods.find(p=>p.id===periodId)?.label}`;document.querySelector('#deleteCell').hidden=!l;document.querySelector('#subjects').innerHTML=[...new Set(lessons.map(x=>x.subject))].map(x=>`<option value="${esc(x)}"></option>`).join('');if(!dialog.open)dialog.showModal();f.subject.focus();}
// Preserve unsaved fields while showing validation errors or an in-flight save.
// Successful refreshes and timetable switches render from the loaded data.
function render(preserveForms=false){
  const key=form=>form.id||`period:${form.dataset.period}`;
  const drafts=new Map(preserveForms?Array.from(root.querySelectorAll('form'),form=>[
    key(form),Array.from(form.elements).filter(field=>field.name&&field.type!=='file').map(field=>({name:field.name,value:field.value,checked:field.checked}))
  ]):[]);
  renderContent();
  if(preserveForms)for(const form of root.querySelectorAll('form'))for(const draft of drafts.get(key(form))??[]){
    const field=form.elements.namedItem(draft.name);
    if(field){field.value=draft.value;if(typeof draft.checked==='boolean')field.checked=draft.checked;}
  }
}
function renderContent(){const errors=error?`<div class="banner" role="alert">${esc(error)}</div>`:'';if(loading){root.innerHTML=errors+'<div class="card muted">Loading household timetables…</div>';return;}let html=errors;if(!DB)html+='<div class="banner">Demo preview. Open the app from a household to save a timetable.</div>';const editable=selected&&canEdit(selected)&&!busy;
html+=`<section class="card"><h2>Students</h2><div class="list">${timetables.length?timetables.map(t=>`<div class="row ${t.id===selected?.id?'today':''}"><div><strong>${esc(nameOf(t.member_id))}</strong> · ${esc(t.name)} <span class="muted small">${esc(t.status)} · ${esc(t.cycle_kind==='weekly'?`${t.cycle_length}-week cycle`:`${t.cycle_length}-day rotation`)}</span></div><button data-select="${esc(t.id)}" ${busy?'disabled':''}>Open</button></div>`).join(''):'<div class="muted">No timetables yet.</div>'}</div></section>`;
html+=`<section class="card"><h2>New timetable</h2><form id="setup" class="stack"><div class="fields"><label>Student<select name="student" ${adult()?'':'disabled'}>${members.filter(m=>m.role!=='guest'&&(adult()||m.id===me?.id)).map(m=>`<option value="${esc(m.id)}">${esc(m.name)}</option>`).join('')}</select></label><label>Timetable name<input name="name" required value="School"></label><label>Cycle<select name="cycle_kind"><option value="weekly">Weekly pattern</option><option value="day_rotation">Rotating school days</option></select></label><label>Cycle length<input name="cycle_length" type="number" min="1" max="10" value="2" required></label></div><div class="fields"><label>Known school date<input name="phase_date" type="date" value="${esc(today)}" required></label><label>Week/day number (first = 1)<input name="phase" type="number" min="1" value="1" required></label><label>Term starts<input name="start_date" type="date" value="${esc(mondayOf(today))}" required></label><label>Term ends<input name="end_date" type="date" value="${esc(addDays(today,90))}" required></label></div><label><input name="consumes" type="checkbox" style="width:auto"> An overridden rotation day consumes a cycle day</label><div class="small muted">Choose which week or day the known date follows. The app calculates the anchor.</div><div class="fields"><label>Bell periods<input name="period_count" type="number" min="0" max="12" value="6" required></label><label>First bell<input name="first_start" type="time" value="08:30" required></label><label>Minutes per period<input name="period_minutes" type="number" min="10" max="120" value="45" required></label><label>Break minutes<input name="break_minutes" type="number" min="0" max="60" value="5" required></label></div><div><button class="primary" ${busy||!DB||!me?.id?'disabled':''}>Create timetable</button></div></form></section>`;
html+=importCard();
if(!selected){root.innerHTML=html;return;}const slots=columnSlots(selected),todaySlot=today>=selected.start_date&&today<=selected.end_date?slotForDate(today,selected,exceptions):null;
html+=`<section class="card"><h2>${esc(nameOf(selected.member_id))} · ${esc(selected.name)}</h2><div class="muted small">${esc(selected.start_date)} to ${esc(selected.end_date)} · revision ${esc(selected.revision)} · today: ${todaySlot===null?'no school':esc(slots.find(x=>x.slot===todaySlot)?.label??'school day')}</div><div class="actions">${selected.status==='draft'?`<button data-activate ${editable?'':'disabled'}>Activate draft</button>`:''}<button data-archive ${editable?'':'disabled'}>Archive</button>${selected.cycle_kind==='weekly'&&selected.cycle_length>1?`<button data-copy ${editable?'':'disabled'}>Copy Week A → B</button>`:''}</div></section>`;
html+=`<section class="card"><h2>Bell schedule</h2><div class="list">${periods.map(p=>`<form class="period-form" data-period="${esc(p.id)}"><label>Period<input name="label" value="${esc(p.label)}" required></label><label>Starts<input name="start_time" type="time" value="${esc(p.start_time)}" required></label><label>Ends<input name="end_time" type="time" value="${esc(p.end_time)}" required></label><div class="actions"><button ${editable?'':'disabled'}>Save</button><button type="button" data-delete-period="${esc(p.id)}" class="danger" ${editable?'':'disabled'}>Remove</button></div></form>`).join('')}</div><form class="period-form" data-period=""><label>New period<input name="label" placeholder="Period 1" required></label><label>Starts<input name="start_time" type="time" required></label><label>Ends<input name="end_time" type="time" required></label><button class="primary" ${editable?'':'disabled'}>Add</button></form></section>`;
html+=`<section class="card"><h2>Lessons</h2>${periods.length?`<div class="grid-wrap"><table class="grid"><thead><tr><th class="period">Time</th>${slots.map(s=>`<th class="${s.slot===todaySlot?'today':''}">${esc(s.label)}<br><button data-clear-day="${s.slot}" class="small" ${editable?'':'disabled'}>Clear day</button></th>`).join('')}</tr></thead><tbody>${periods.map(p=>`<tr><th class="period">${esc(p.label)}<br><span class="muted small">${esc(p.start_time)}–${esc(p.end_time)}</span></th>${slots.map(s=>{const l=lessons.find(x=>x.slot===s.slot&&x.period_id===p.id);return`<td class="${s.slot===todaySlot?'today':''}"><button class="cell ${l?'':'empty'}" data-cell="${s.slot}|${esc(p.id)}" ${editable?'':'disabled'}>${l?`<strong>${esc(l.subject)}</strong><span class="small">${esc(l.room)} ${esc(l.teacher)}</span>`:'Add lesson'}</button></td>`}).join('')}</tr>`).join('')}</tbody></table></div>`:'<p class="muted">Add bell periods to start the grid.</p>'}</section>`;
const exText=exceptions.map(e=>e.kind==='no_school'?`no_school | ${e.start_date} | ${e.end_date} | ${e.label}`:`day_override | ${e.start_date} | ${e.override_slot} | ${e.label}`).join('\n');
html+=`<section class="card"><h2>Term dates and exceptions</h2><form id="term" class="stack"><div class="fields"><label>Starts<input name="start_date" type="date" value="${esc(selected.start_date)}" required></label><label>Ends<input name="end_date" type="date" value="${esc(selected.end_date)}" required></label><label>Anchor date<input name="anchor_date" type="date" value="${esc(selected.anchor_date)}" required></label></div><label><input name="consumes" type="checkbox" style="width:auto" ${selected.override_consumes_cycle_day?'checked':''}> Overrides consume a rotation day</label><label>Exceptions, one per line<textarea name="exceptions" spellcheck="false" placeholder="no_school | 2026-10-12 | 2026-10-16 | Break&#10;day_override | 2026-10-23 | 0 | Runs Day 1">${esc(exText)}</textarea></label><div class="small muted">Use no_school | start | end | label, or day_override | date | slot | label. For a weekly cycle, Monday in Week A is slot 0, Tuesday is 1, and Week B Monday is 7. For a rotation, Day 1 is slot 0.</div><div><button class="primary" ${editable?'':'disabled'}>Save term</button></div></form></section>`;root.innerHTML=html;}
root.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;try{if(b.dataset.select)await loadSelected(b.dataset.select),render();else if(b.dataset.cell){const [slot,id]=b.dataset.cell.split('|');openCell(Number(slot),id);}else if(b.dataset.deletePeriod)await deletePeriod(b.dataset.deletePeriod);else if(b.hasAttribute('data-clear-day'))await clearDay(Number(b.dataset.clearDay));else if(b.hasAttribute('data-copy'))await copyWeek();else if(b.hasAttribute('data-activate'))await activateDraft();else if(b.hasAttribute('data-archive'))await archive();else if(b.hasAttribute('data-import-back')){importReview=null;render();}else if(b.hasAttribute('data-import-cancel')){importReview=null;importText='';render();}}catch(err){message(err);}});
// Record import form input as it is typed, so any redraw (Open, Refresh, midnight, a save) keeps it.
root.addEventListener('input',e=>{const form=e.target.form;if(form?.id==='importReview'&&importReview&&e.target.name)importReview.values={...importReview.values,[e.target.name]:e.target.type==='checkbox'?(e.target.checked?'on':''):e.target.value};else if(form?.id==='importText'&&e.target.name==='text')importText=e.target.value;});
root.addEventListener('change',async e=>{try{if(e.target.name==='file'&&e.target.closest('#importText')){const file=e.target.files?.[0];if(!file)return;if(file.size>IMPORT_LIMITS.bytes)throw new Error('The file is larger than 2 MB. Export only this timetable.');importText=await file.text();e.target.form.elements.namedItem('text').value=importText;}else if(e.target.name==='cycle_length'&&e.target.closest('#importReview')){const n=Number(e.target.value),c=importReview.candidate;if(Number.isInteger(n)&&n>=c.min_cycle_length&&n<=(c.cycle_kind==='weekly'?4:10)){importReview.candidate={...c,cycle_length:n};const phase=e.target.form.elements.namedItem('phase');if(phase)phase.max=String(n);root.querySelector('#importPreview').innerHTML=previewGrid(importReview.candidate);root.querySelector('#importDiff').innerHTML=diffHtml(importReview);}}else if(e.target.name==='student'&&e.target.closest('#importReview')){importReview.student=e.target.value;busy=true;render();try{await loadComparison();}finally{busy=false;render();}}}catch(err){message(err);}});
root.addEventListener('submit',async e=>{e.preventDefault();try{if(e.target.id==='setup'){const f=e.target;const data=new FormData(f);data.set('phase',String(Number(data.get('phase'))-1));const temp=document.createElement('form');for(const [k,v] of data)temp.innerHTML+=`<input name="${esc(k)}" value="${esc(v)}">`;await createTimetable(temp);}else if(e.target.hasAttribute('data-period'))await savePeriod(e.target);else if(e.target.id==='term')await saveTerm(e.target);else if(e.target.id==='importText')await previewImport(String(new FormData(e.target).get('text')??''));else if(e.target.id==='importReview')await saveImport(e.target);}catch(err){message(err);}});
document.querySelector('#cellForm').addEventListener('submit',async e=>{e.preventDefault();try{await saveLesson(Object.fromEntries(new FormData(e.target)),e.submitter?.value);}catch(err){message(err);}});
document.querySelector('#deleteCell').addEventListener('click',()=>clearLesson().catch(message));document.querySelector('#closeDialog').addEventListener('click',()=>dialog.close());document.querySelector('#refresh').addEventListener('click',refreshIfIdle);
// Both skip while a save is in flight: refresh clears busy and would re-enable Import mid-import.
function refreshIfIdle(){if(!busy&&!importing)refresh();}
function midnightTick(){if(localToday()!==today&&!busy&&!importing)refresh();}
setInterval(midnightTick,60_000);refresh();
