async function loadSelected(id){if(!id){selected=null;periods=[];lessons=[];exceptions=[];return;}const before=(await db(`SELECT * FROM ${T}timetables WHERE id = ? LIMIT 1`,[id]))[0];if(!before)throw new Error('Timetable is no longer available.');const [p,l,e]=await Promise.all([pages('periods',id,'sort_order'),pages('lessons',id,'slot'),pages('exceptions',id,'start_date')]);const after=(await db(`SELECT revision FROM ${T}timetables WHERE id = ? LIMIT 1`,[id]))[0];if(before.revision!==after?.revision)throw new Error('Timetable changed while loading. Refresh before editing.');selected=before;periods=p;lessons=l;exceptions=e;validateTimetable(selected,exceptions);validateLessons(lessons,periods,selected);}
async function refresh(keepId=selected?.id){const drafts=formDrafts(submittedForm),showing=selected?.id;busy=true;loading=true;render();try{await loadContext();today=localToday();await loadList();const id=timetables.find(t=>t.id===keepId)?.id??timetables.find(t=>t.status==='active')?.id??null;await loadSelected(id);error='';}catch(e){error=e.message;}finally{if(importReview)await loadComparison();busy=false;loading=false;render();restoreForms(drafts,selected?.id===showing);}}
function updateGuard(changes=''){return {sql:`UPDATE ${T}timetables SET revision = revision + 1, updated_at = ?${changes} WHERE id = ? AND revision = ?`,params:[now(),selected.id,selected.revision],requireChanges:true};}
// Returns whether the save went through; a failure to reload afterwards is shown on the page, not as a failed save.
async function guarded(statements){if(!selected||!canEdit(selected))throw new Error('You cannot edit this timetable.');busy=true;render(true);try{await batch([updateGuard(),...statements]);}catch(e){error=e.message.includes('Stale state claim')?'Someone changed this timetable. Refresh and try again.':e.message;busy=false;render(true);return false;}await refresh(selected.id);return true;}
function insertRows(table,columns,rows,chunkSize=20){chunkSize=Math.min(chunkSize,Math.floor(100/columns.length));const statements=[];for(let i=0;i<rows.length;i+=chunkSize){const chunk=rows.slice(i,i+chunkSize);statements.push({sql:`INSERT INTO ${T}${table} (${columns.join(',')}) VALUES ${chunk.map(()=>`(${columns.map(()=>'?').join(',')})`).join(',')}`,params:chunk.flatMap(row=>columns.map(c=>row[c]===undefined?'':row[c]))});}return statements;}
function projectionStatements(t,e){const rows=projectSchoolDays(t,e).map(r=>({...r,created_by:me.id}));return [{sql:`DELETE FROM ${T}school_days WHERE timetable_id = ?`,params:[t.id]},...insertRows('school_days',['id','timetable_id','day_date','slot','created_by'],rows,20)];}
function message(e){error=e.message??String(e);busy=false;render(true);}
function addMinutes(time,minutes){const [h,m]=time.split(':').map(Number),n=h*60+m+minutes;if(n<0||n>=1440)throw new Error('Bell schedule must fit within one day.');return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;}
function starterPeriods(t,v){const count=Number(v.period_count),duration=Number(v.period_minutes),gap=Number(v.break_minutes),first=v.first_start;if(!Number.isInteger(count)||count<0||count>12||!Number.isInteger(duration)||duration<10||duration>120||!Number.isInteger(gap)||gap<0||gap>60)throw new Error('Use 0–12 bell periods, 10–120 lesson minutes and 0–60 break minutes.');const rows=[];for(let i=0;i<count;i++){const start_time=addMinutes(first,i*(duration+gap)),end_time=addMinutes(start_time,duration);rows.push({id:crypto.randomUUID(),timetable_id:t.id,label:`Period ${i+1}`,start_time,end_time,sort_order:i,created_by:me.id});}validatePeriods(rows);return rows;}
async function createTimetable(form){if(!me?.id)throw new Error('Member identity is required.');const v=Object.fromEntries(new FormData(form));const member_id=adult()?v.student:me.id;if(!member_id)throw new Error('Choose a student.');const cycle_kind=v.cycle_kind,cycle_length=Number(v.cycle_length),phase=Number(v.phase),date=v.phase_date;const t={id:crypto.randomUUID(),member_id,name:v.name.trim(),cycle_kind,cycle_length,anchor_date:anchorFromPhase(date,cycle_kind,cycle_length,phase),start_date:v.start_date,end_date:v.end_date,override_consumes_cycle_day:v.consumes==='on'?1:0,status:'draft',revision:0,export_mode:'off',created_by:me.id,created_at:now(),updated_at:now()};validateTimetable(t);const starter=starterPeriods(t,v);const previous=timetables.find(x=>x.member_id===member_id&&x.status==='active');if(previous&&!confirm(`Archive ${previous.name} and replace it with this timetable?`))return;busy=true;render(true);let inserted=false,activated=false;try{
await db(`INSERT INTO ${T}timetables (id,member_id,name,cycle_kind,cycle_length,anchor_date,start_date,end_date,override_consumes_cycle_day,status,revision,export_mode,created_by,created_at,updated_at) VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)`,Object.keys(t).map(k=>t[k]));inserted=true;
const statements=[];if(previous)statements.push({sql:`UPDATE ${T}timetables SET status = 'archived', revision = revision + 1, updated_at = ? WHERE id = ? AND revision = ?`,params:[now(),previous.id,previous.revision],requireChanges:true});

}catch(e){
// A draft whose setup failed is removed, so retrying does not leave empty drafts behind.
if(inserted&&!activated){submittedForm=null;const removed=await request({sql:`DELETE FROM ${T}timetables WHERE id = ? AND status = 'draft'`,params:[t.id]}).then(j=>j.changed===1,()=>false);await refresh(selected?.id);message(removed?e:new Error(`${e.message} The empty draft ${t.name} could not be removed; delete it before trying again.`));}else message(e);}}
function activationStatements(t,previous,e){const st=[];if(previous)st.push({sql:`UPDATE ${T}timetables SET status = 'archived', revision = revision + 1, updated_at = ? WHERE id = ? AND revision = ?`,params:[now(),previous.id,previous.revision],requireChanges:true});st.push({sql:`UPDATE ${T}timetables SET status = 'active', revision = revision + 1, updated_at = ? WHERE id = ? AND revision = ?`,params:[now(),t.id,t.revision],requireChanges:true});st.push(...projectionStatements(t,e));return st;}
async function activateDraft(){if(selected.status!=='draft')return;const previous=timetables.find(x=>x.member_id===selected.member_id&&x.status==='active');if(previous&&!confirm(`Archive ${previous.name} and activate this draft?`))return;const st=activationStatements(selected,previous,exceptions);busy=true;render(true);try{await batch(st);await refresh(selected.id);}catch(e){message(e);}}
const cycleText=t=>t.cycle_kind==='weekly'?`${t.cycle_length}-week cycle`:`${t.cycle_length}-day rotation`;
// A calendar file is read over the recent past and the coming year; its cycle is inferred (plan §5.1).
async function previewImport(text){const ics=/^\uFEFF?\s*BEGIN:VCALENDAR/i.test(text);let candidate,inference=null,observations=[];if(ics){const parsed=parseIcs(text,{timezone:householdZone,from:addDays(today,-120),to:addDays(today,366)});observations=parsed.observations;inference=inferTimetable(parsed);candidate=candidateForFit(inference,observations,0);}else candidate=buildCandidate(parseTimetableText(text));// Portals stamp every export with the download time (DTSTAMP); the repeat notice ignores it.
const digest=candidate.errors.length?'':await digestText(ics?text.replace(/^DTSTAMP[:;].*$/gim,''):text);importText=text;importReview={text,source_kind:ics?'ics':'csv',digest,candidate,inference,observations,fit:0,today,student:adult()?members.find(m=>m.role!=='guest')?.id??null:me?.id??null,compare:null};await loadComparison();followTerm(importReview);error='';render(true);}
// Build from a synced calendar: one member's rows from the hub, read once; each preview works from those rows.
async function loadSynced(member){if(!CONTEXT)throw new Error('Open this app inside a household to read its synced calendars.');if(!member)throw new Error('Choose whose calendars to read.');const s=synced={member,state:'loading'};showSynced();const key=`family.calendar.member:${member}`;const failed=e=>new Error(e.name==='TimeoutError'?'Reading synced calendars took too long. Try again.':'Could not read synced calendars. Check the connection and try again.');try{const fetchedAt=new Date().toISOString();const res=await fetch(`${CONTEXT}?keys=${encodeURIComponent(key)}&days=${SYNC_LIMITS.horizonDays}`,{cache:'no-store',signal:AbortSignal.timeout(20000)}).catch(e=>{throw failed(e);});
// The timeout also covers reading the body; a body cut short is a failed read, not a refused key.
const j=await res.json().catch(e=>{if(res.ok||e.name==='TimeoutError')throw failed(e);return {};});if(!res.ok)throw new Error(j.error||`Could not read synced calendars (${res.status}).`);

if(j.$errors?.includes(key))throw new Error('Could not read synced calendars just now. Try again.');if(!Array.isArray(j[key]))throw new Error('Timetable cannot read synced calendars yet. Reload the app and try again; if it still fails, check that a household admin approved calendar access.');if(synced===s)synced={member,state:'ready',fetchedAt,rows:j[key],sources:calendarSources(j[key],{timezone:householdZone})};}catch(e){if(synced===s)synced={member,state:'error',error:e.message};}if(synced?.member===member)showSynced();}
// Redraws only the synced form, so a load finishing does not take focus from whatever is being typed elsewhere.
// The member select stays disabled while loading, so the list shown always belongs to the member selected.
function showSynced(){const form=root.querySelector('#importSynced');if(!form)return;const list=form.querySelector('#syncedSources'),find=form.querySelector('[data-find-synced]'),select=form.elements.namedItem('calendar_member'),loading=synced?.state==='loading';if(list)list.innerHTML=syncedHtml();if(find)find.disabled=busy||!CONTEXT||loading;if(select&&adult())select.disabled=loading;}
async function previewSynced(v){const s=synced;if(s?.state!=='ready')throw new Error('Find the synced calendars first.');const source=s.sources.find(x=>x.key===v.source);if(!source)throw new Error('Choose a calendar.');// The window is placed at the moment the rows were read, however long ago Find was pressed.

const sourceName=(src,sources)=>{if(src.name)return src.name;const kind=src.provider==='google'?'Google calendar':src.provider==='apple'?'Apple calendar':'Calendar feed';const same=sources.filter(x=>!x.name&&x.provider===src.provider);return same.length>1?`${kind} ${same.indexOf(src)+1}`:kind;};
function syncedHtml(){const s=synced;if(!s)return '';const who=esc(nameOf(s.member));if(s.state==='loading')return '<p class="small muted">Reading synced calendars…</p>';if(s.state==='error')return `<div class="banner" role="alert">${esc(s.error)}</div>`;if(!s.sources.length)return `<p class="small muted">No synced events for ${who} in the next ${SYNC_LIMITS.horizonDays/7} weeks. Connect the school calendar in Calendar and sync it, then try again.</p>`;
return `<fieldset class="stack"><legend>${who}’s calendars</legend>${s.sources.map((x,i)=>`<label><input type="radio" name="source" value="${esc(x.key)}" style="width:auto" ${x.key===(s.sources.some(y=>y.key===s.source)?s.source:s.sources[0].key)?'checked':''}> <strong>${esc(sourceName(x,s.sources))}</strong> · ${x.count} ${x.count===1?'event':'events'}${x.first?`, ${esc(x.first)} to ${esc(x.last)}`:''}${x.samples.length?`<br><span class="small muted">${esc(x.samples.join(', '))}</span>`:''}</label>`).join('')}</fieldset><div><button class="primary" ${busy?'disabled':''}>Preview import</button></div>`;}
// The replace diff needs the student's active grid, which is only loaded for the selected timetable.
// compare is {student,state:'none'|'loading'|'ready'|'error',...}; a load that finishes after the
// student changed is dropped, and Import stays disabled until the current student's state settles.
async function loadComparison(){const r=importReview;if(!r)return;const student=r.student;const current=DB&&!r.candidate.errors.length?timetables.find(t=>t.member_id===student&&t.status==='active'):null;if(!current){r.compare={student,state:'none'};return;}if(r.compare?.student===student&&r.compare.state==='ready'&&r.compare.timetable.id===current.id&&r.compare.timetable.revision===current.revision)return;r.compare={student,state:'loading',timetable:current};try{const [p,l,x]=await Promise.all([pages('periods',current.id,'sort_order'),pages('lessons',current.id,'slot'),pages('exceptions',current.id,'start_date')]);if(importReview===r&&r.student===student)r.compare={student,state:'ready',timetable:current,periods:p,lessons:l,exceptions:x};}catch(e){if(importReview===r&&r.student===student)r.compare={student,state:'error',timetable:current,error:e.message};}}
const comparisonReady=r=>{const c=r.compare,active=timetables.find(t=>t.member_id===r.student&&t.status==='active');if(c?.student!==r.student)return false;if(c.state==='none')return !active;return c.state==='ready'&&!!active&&c.timetable.id===active.id&&c.timetable.revision===active.revision;};
// Import saves a new draft across guarded batches, then activates it in one batch (plan §5.5).
// A failed population discards the draft; a failed activation leaves a complete draft to activate later.

root.addEventListener('submit',async e=>{e.preventDefault();submittedForm=formKey(e.target);try{if(e.target.id==='setup'){const f=e.target;const data=new FormData(f);data.set('phase',String(Number(data.get('phase'))-1));const temp=document.createElement('form');for(const [k,v] of data)temp.innerHTML+=`<input name="${esc(k)}" value="${esc(v)}">`;await createTimetable(temp);}else if(e.target.hasAttribute('data-period'))await savePeriod(e.target);else if(e.target.id==='term')await saveTerm(e.target);else if(e.target.id==='importText')await previewImport(String(new FormData(e.target).get('text')??''));else if(e.target.id==='importSynced'){if(synced?.state==='ready'&&synced.sources.length)await previewSynced(Object.fromEntries(new FormData(e.target)));}else if(e.target.id==='importReview')await saveImport(e.target);}catch(err){message(err);}finally{submittedForm=null;}});
// The lesson dialog covers the page banner, so its errors are shown inside it.
function cellError(text){const box=document.querySelector('#cellError');box.textContent=text;box.hidden=!text;}
document.querySelector('#cellForm').addEventListener('submit',async e=>{e.preventDefault();cellError('');try{await saveLesson(Object.fromEntries(new FormData(e.target)),e.submitter?.value);}catch(err){message(err);cellError(err.message??String(err));}});
// An imported lesson has no colour; the picker shows a default, which is saved only once it is changed.
document.querySelector('#cellForm').color.addEventListener('input',()=>{document.querySelector('#cellForm').color_set.value='1';});
document.querySelector('#deleteCell').addEventListener('click',()=>{cellError('');clearLesson().catch(err=>{message(err);cellError(err.message??String(err));});});document.querySelector('#closeDialog').addEventListener('click',()=>dialog.close());document.querySelector('#refresh').addEventListener('click',refreshIfIdle);
// Both skip while a save is in flight: refresh clears busy and would re-enable Import mid-import.
function refreshIfIdle(){if(!busy&&!importing)refresh();}
function midnightTick(){if(localToday()!==today&&!busy&&!importing)refresh();}
setInterval(midnightTick,60_000);refresh();
</script></body></html>
